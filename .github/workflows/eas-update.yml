# Publishes the app as an EAS Update on every push to main,
# so the phone can load it without the laptop running `expo start`.
#
# One-time setup (see README "Use it without your laptop"):
#   1. Run `npx eas-cli init` and `npx eas-cli update:configure` in mobile/ and commit app.json.
#   2. Create a token at https://expo.dev/settings/access-tokens
#   3. Add it to GitHub: repo Settings > Secrets and variables > Actions > New secret named EXPO_TOKEN.

name: Publish EAS Update

on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/eas-update.yml"
  workflow_dispatch:

concurrency:
  group: eas-update-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    name: Test and publish
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5

      - name: Check for EXPO_TOKEN
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_API_KEY_ARKADEEP}}
        run: |
          if [ -z "$EXPO_API_KEY_ARKADEEP" ]; then
            echo "::error::Missing EXPO_TOKEN secret. Add it under repo Settings > Secrets and variables > Actions."
            exit 1
          fi

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Set up EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_API_KEY_ARKADEEP }}

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --ci

      - name: Publish update
        env:
          MESSAGE: ${{ github.event.head_commit.message || 'Manual publish' }}
        run: eas update --branch main --environment production --message "$MESSAGE" --non-interactive

      - name: Add link to run summary
        run: |
          echo "### Published to EAS Update (branch \`main\`)" >> "$GITHUB_STEP_SUMMARY"
          echo "Open it in Expo Go: https://expo.dev/accounts/strawhat98/projects/webskin/updates" >> "$GITHUB_STEP_SUMMARY"
